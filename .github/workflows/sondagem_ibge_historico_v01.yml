name: Sondar IBGE censos 1991 2000 populacao e PIB historicos

on:
  push:
    paths:
      - '.github/workflows/sondagem_ibge_historico_v01.yml'
      - 'scripts/32_sondagem_ibge_historico.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondagem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python scripts/32_sondagem_ibge_historico.py
      - uses: actions/upload-artifact@v4
        with:
          name: sondagem-ibge-historica-v01
          path: outputs/viabilidade_historica_ibge_v01/
      - name: Versionar sem regravar arquivos anteriores
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/viabilidade_historica_ibge_v01/consulta_serie_historica_sidra.json
          git commit -m 'Documentar viabilidade do SIDRA 1991–2009 sem imputar dados'
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
