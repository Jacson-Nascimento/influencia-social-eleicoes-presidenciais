name: Modelos seis eleições 2002 a 2022 validação espacial temporal

on:
  push:
    paths:
      - '.github/workflows/modelos_2002_2022_historicos_v01.yml'
      - 'scripts/36_modelos_seis_eleicoes_historicos.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seis_pleitos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Amostra histórica comum modelos C M
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/36_modelos_seis_eleicoes_historicos.py \
            --mapa outputs/municipal_v01/chaves_tse_ibge_5570_centroides.csv \
            --historico outputs/inventario_tse_historico_v01 \
            --ibge_historico outputs/controles_ibge_historicos_v01/controles_2002_2006_2010.csv \
            --votos2014 outputs/piloto_2014_v01/votos_2014_segundo_turno_municipios.csv \
            --ibge2014 outputs/piloto_2014_ibge_v01/controles_IBGE_para_eleicao_2014.csv \
            --votos2018_2022 outputs/competitividade_v02/competitividade_e_margem_assinada_segundo_turno.csv \
            --ibge2018_2022 data/ibge_tratados/controles_pre_eleitorais_v02.csv \
            --saida outputs/modelos_seis_eleicoes_v01
      - name: Regras mínimas de validade
        run: |
          python - <<'PY'
          import json,pandas as pd
          p='outputs/modelos_seis_eleicoes_v01/'
          m=json.load(open(p+'manifesto.json'))
          g=pd.read_csv(p+'validacao_uf_seis_eleicoes.csv')
          t=pd.read_csv(p+'validacao_temporal_seis_eleicoes.csv')
          assert m['municipios_amostra_comum']>=5400
          assert m['observacoes']==m['municipios_amostra_comum']*6
          assert len(g)==36 and len(t)>=54
          assert all(g.n==m['municipios_amostra_comum'])
          assert set(g.ano)=={2002,2006,2010,2014,2018,2022}
          for d in (g,t):
              assert d[['ganho_rmse_pct','ic95_uf_inf','ic95_uf_sup']].notna().all().all()
              assert (d.ic95_uf_inf<d.ic95_uf_sup).all()
          print(m['municipios_amostra_comum'],len(g),len(t))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelos-seis-eleicoes-2002-2022-v01
          path: outputs/modelos_seis_eleicoes_v01/
          retention-days: 90
      - name: Versionar separadamente das versões v14 v15
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/modelos_seis_eleicoes_v01/*.csv
          git add outputs/modelos_seis_eleicoes_v01/*.json
          git commit -m 'Registrar extensão experimental de seis eleições sem 1998'
          for k in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
