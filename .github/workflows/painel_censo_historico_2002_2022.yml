name: Painel Censo antecedente 2002 a 2022 seis pleitos

on:
  push:
    paths:
      - '.github/workflows/painel_censo_historico_2002_2022.yml'
      - 'scripts/36_painel_eleitoral_censos_2002_2022.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  painelhistorico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - name: Preparar os seis segundos turnos com Censos antecedentes
        run: |
          OPENBLAS_NUM_THREADS=1 python scripts/36_painel_eleitoral_censos_2002_2022.py \
            --tse2002 outputs/inventario_tse_historico_v01/2002/votos_presidenciais_municipais_2002.csv \
            --tse2006 outputs/inventario_tse_historico_v01/2006/votos_presidenciais_municipais_2006.csv \
            --tse2010 outputs/inventario_tse_historico_v01/2010/votos_presidenciais_municipais_2010.csv \
            --votos2014 outputs/piloto_2014_v01/votos_2014_segundo_turno_municipios.csv \
            --votos2018_2022 outputs/competitividade_v02/competitividade_e_margem_assinada_segundo_turno.csv \
            --ibge_historico outputs/controles_ibge_historicos_v01/controles_2002_2006_2010.csv \
            --ibge_2014 outputs/piloto_2014_ibge_v01/controles_IBGE_para_eleicao_2014.csv \
            --ibge_recente data/ibge_tratados/controles_pre_eleitorais_v02.csv \
            --mapa outputs/municipal_v01/chaves_tse_ibge_5570_centroides.csv \
            --out outputs/painel_censos_2002_2022_v01
      - name: Testes de integridade e exclusão de 1998
        run: |
          python - <<'PY'
          import pandas as pd,json
          p='outputs/painel_censos_2002_2022_v01/'
          x=pd.read_csv(p+'painel_seis_eleicoes_2002_2022.csv')
          info=json.load(open(p+'manifesto.json'))
          assert sorted(x.ano.unique().tolist())==[2002,2006,2010,2014,2018,2022]
          assert len(x)==6*x.CD_MUNICIPIO_IBGE.nunique()
          assert not x.duplicated(['ano','CD_MUNICIPIO_IBGE']).any()
          assert x[x.ano<=2010].censo_antecedente.eq(2000).all()
          assert x[x.ano>=2014].censo_antecedente.eq(2010).all()
          assert info['nao_usar_1998'] is True
          print(info['amostra_comum'],info['n_observacoes'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painel-historico-censo-antecedente-2002-2022
          path: outputs/painel_censos_2002_2022_v01/
          retention-days: 90
      - name: Registrar apenas versões novas
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/painel_censos_2002_2022_v01/*.csv
          git add outputs/painel_censos_2002_2022_v01/*.json
          git commit -m 'Construir painel com Censos 2000 e 2010 antecedentes sem 1998'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
