name: Persistencia temporal de concentracao municipal

on:
  push:
    paths:
      - '.github/workflows/persistencia_hhi_municipal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persistencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencias e testes
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'scipy>=1.12,<2'
          python -m unittest discover -s tests -v
      - name: Estimar estabilidade e mudanca dos indicadores
        run: |
          python scripts/11_persistencia_hhi_municipal.py \
            --mapa outputs/municipal_v01/chaves_tse_ibge_5570_centroides.csv \
            --hhi outputs/municipal_v01/hhi_municipal_2018_2022.csv \
            --reps 1999 \
            --saida outputs/municipal_v02/persistencia_temporal_e_delta_hhi.json
      - name: Publicar novo relatorio sem sobrescrever v01
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/municipal_v02/persistencia_temporal_e_delta_hhi.json
          git commit -m 'Documentar persistencia temporal municipal e Moran das mudancas entre turnos'
          git pull --rebase origin main
          git push origin HEAD:main
