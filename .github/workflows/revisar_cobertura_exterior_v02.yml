name: Revisar cobertura municipal e exterior v02

on:
  push:
    paths:
      - '.github/workflows/revisar_cobertura_exterior_v02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comparativo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar e verificar testes
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Calcular v02 sem excluir localidades com zero voto
        run: |
          python scripts/07_comparativo_territorial.py \
            --base2018 data/tratados/votos_presidente_municipio_2018_RESSALVA.csv \
            --base2022 data/tratados/votos_presidente_municipio_2022.csv \
            --pasta outputs/comparativo_v02
          python - <<'PY'
          import pandas as pd
          a = pd.read_csv("outputs/comparativo_v02/resumo_nacional_2018_2022.csv")
          for ano, expected in ((2018, 138), (2022, 181)):
              x = a[a.ano == ano].set_index("turno")
              assert len(x) == 2
              assert (x.municipios_brasil == 5570).all()
              assert (x.localidades_exterior == expected).all()
          print("Validação de cobertura completa nos dois turnos e anos.")
          PY
      - name: Publicar versão 2 sem apagar versão anterior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/comparativo_v02/*.csv
          git add outputs/comparativo_v02/*.json
          git commit -m "Versionar comparativo territorial v02 com localidades ZZ de zero voto"
          git pull --rebase origin main
          git push origin HEAD:main
