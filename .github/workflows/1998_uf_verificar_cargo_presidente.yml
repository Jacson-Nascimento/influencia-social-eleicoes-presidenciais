name: Verificar presidencia em CSV TSE 1998 estaduais

on:
  push:
    paths:
      - '.github/workflows/1998_uf_verificar_cargo_presidente.yml'
      - 'scripts/40_verificar_presidente_tse_1998_uf.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        uf: [AC, RS, SP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - run: |
          OPENBLAS_NUM_THREADS=1 python scripts/40_verificar_presidente_tse_1998_uf.py \
            --uf ${{ matrix.uf }} \
            --out outputs/verificacao_presidente_1998_ufs_v01/${{ matrix.uf }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificar-presidente-1998-${{ matrix.uf }}
          path: outputs/verificacao_presidente_1998_ufs_v01/${{ matrix.uf }}.json
      - name: Registrar diagnóstico histórico sem imputação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/verificacao_presidente_1998_ufs_v01/${{ matrix.uf }}.json
          git commit -m 'Documentar presidencial 1998 UF ${{ matrix.uf }} com cabeçalho correto'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
