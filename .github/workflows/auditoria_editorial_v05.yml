name: Auditoria editorial final do manuscrito v05
# Reexecução após correção dos delimitadores LaTeX nas equações

on:
  push:
    paths:
      - '.github/workflows/auditoria_editorial_v05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar e testar
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Conferir manuscrito e fontes tabulares
        run: |
          python scripts/21_auditoria_editorial_manuscrito.py \
            --manuscrito docs/MANUSCRITO_COMPETITIVIDADE_V05_REVISAO_EDITORIAL.md \
            --modelos outputs/competitividade_modelos_v01/modelos_competitividade_e_direcao_k4_k8_k12.csv \
            --pesos outputs/competitividade_ponderada_v01/modelos_ponderados_competitividade_e_direcao.csv \
            --robustez outputs/robustez_demografica_v01/robustez_pesos_populacao_e_grandes_cidades.csv \
            --bootstrap outputs/inferencia_espacial_final_v01/incerteza_rmse_bootstrap_uf.csv \
            --conciliacao outputs/auditoria_documental_final_v01/reconciliacao_candidatos_e_totais.csv \
            --saida outputs/auditoria_editorial_v05/resultado_auditoria.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-editorial-v05
          path: outputs/auditoria_editorial_v05/
          retention-days: 90
          if-no-files-found: warn
      - name: Publicar relatório aprovado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/auditoria_editorial_v05/resultado_auditoria.json
          git commit -m 'Registrar auditoria editorial automatizada do manuscrito v05'
          git pull --rebase origin main
          git push origin HEAD:main
