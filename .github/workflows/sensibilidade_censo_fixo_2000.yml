name: Testar Censo 2000 fixo seis pleitos sensibilidade

on:
  push:
    paths:
      - 'scripts/41_sensibilidade_censo_fixo_2000.py'
      - '.github/workflows/sensibilidade_censo_fixo_2000.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  censo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Comparar Censo 2000 fixo com Censo anterior ao pleito
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/41_sensibilidade_censo_fixo_2000.py \
            --painel outputs/painel_censos_2002_2022_v01/painel_seis_eleicoes_2002_2022.csv \
            --orig_geo outputs/modelos_seis_eleicoes_censo_precedente_v01/validacao_geografica_2002_2022.csv \
            --orig_temp outputs/modelos_seis_eleicoes_censo_precedente_v01/validacao_temporal_2002_2022.csv \
            --out outputs/sensibilidade_censo_fixo_2000_v01
      - name: Testar consistência das comparações
        run: |
          python - <<'PY'
          import pandas as pd
          p='outputs/sensibilidade_censo_fixo_2000_v01/'
          a=pd.read_csv(p+'contraste_censo_geografico.csv')
          b=pd.read_csv(p+'contraste_censo_temporal.csv')
          assert len(a)==36 and len(b)==30
          for year in (2002,2006,2010):
              c=a[a.ano.eq(year)]
              assert c.delta_pontos_percentuais.abs().lt(1e-6).all(),c.to_string()
          assert not a[["ganho_rmse_pct_censo2000_fixo","ganho_rmse_pct_censo_antecedente"]].isna().any().any()
          print(a.to_string(index=False));print(b.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sensibilidade-censo-fixo2000-v01
          path: outputs/sensibilidade_censo_fixo_2000_v01/
          retention-days: 90
      - name: Preservar análises sem substituir originais
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/sensibilidade_censo_fixo_2000_v01/*.csv
          git add outputs/sensibilidade_censo_fixo_2000_v01/*.json
          git commit -m 'Documentar sensibilidade do Censo 2000 fixo contra antecedente 2002-2022'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
