name: Modelos municipais com controles IBGE e autocorrelacao residual

on:
  push:
    paths:
      - '.github/workflows/modelos_socioeconomicos_ibge_v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modelos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Preparar dependencias e verificar testes
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'scipy>=1.12,<2'
          python -m unittest discover -s tests -v
      - name: Validar fontes de entrada
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/municipal_v01/chaves_tse_ibge_5570_centroides.csv
          test -s outputs/municipal_v01/hhi_municipal_2018_2022.csv
          test -s data/ibge_tratados/controles_pre_eleitorais_v02.csv
          test -s outputs/controles_ibge_v02/manifesto.json
      - name: Estimar modelos com e sem controles socioeconomicos
        run: |
          python scripts/13_modelos_controles_socioeconomicos.py \
            --mapa outputs/municipal_v01/chaves_tse_ibge_5570_centroides.csv \
            --hhi outputs/municipal_v01/hhi_municipal_2018_2022.csv \
            --ibge data/ibge_tratados/controles_pre_eleitorais_v02.csv \
            --pasta outputs/socioeconomico_v01 \
            --permutacoes 999
      - name: Arquivar outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controles-municipais-e-regressoes-v01
          path: |
            outputs/socioeconomico_v01/
            outputs/controles_ibge_v02/manifesto.json
          retention-days: 90
          if-no-files-found: warn
      - name: Versionar resultados aprovados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/socioeconomico_v01/*.csv
          git add outputs/socioeconomico_v01/*.json
          git commit -m 'Publicar controles e modelos descritivos de HHI com testes espaciais residuais'
          git pull --rebase origin main
          git push origin HEAD:main
