name: Inferencia regional Wald UF e Conley – artigo eleitoral v09

on:
  push:
    paths:
      - '.github/workflows/inferencia_regional_v09.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências e testes
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Reestimar inferencia com benchmark regional
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/26_inferencia_regional_wald_conley.py \
            --mapa outputs/municipal_v01/chaves_tse_ibge_5570_centroides.csv \
            --hhi outputs/municipal_v01/hhi_municipal_2018_2022.csv \
            --ibge data/ibge_tratados/controles_pre_eleitorais_v02.csv \
            --competitividade outputs/competitividade_v02/competitividade_e_margem_assinada_segundo_turno.csv \
            --out outputs/inferencia_regional_v09
      - name: Testar auditoria dos resultados
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('outputs/inferencia_regional_v09/wald_conley_com_macrorregiao.csv')
          assert len(d)==8 and d.n.eq(5565).all()
          assert set(d.desfecho)=={'competitividade','direcao_pt13'}
          assert set(d.ponderacao)=={'uniforme','populacao_anterior'}
          assert (d.n_uf_cluster==27).all()
          for col in ['p_uf_CR1_26gl','p_conley_100km','p_conley_250km']:
              assert d[col].between(0,1).all()
          print(d.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inferencia-com-macrorregiao-v09
          path: outputs/inferencia_regional_v09/
          retention-days: 90
      - name: Commitar apenas resultados aprovados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f outputs/inferencia_regional_v09/*.csv
          git add outputs/inferencia_regional_v09/*.json
          git commit -m 'Documentar testes Wald e Conley com macrorregião para C/M'
          git pull --rebase origin main
          git push origin HEAD:main
